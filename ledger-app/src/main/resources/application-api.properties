# The process that serves requests, and the only one that opens a port.
spring.main.web-application-type=servlet

# At DEBUG these two print the message of an exception they resolve, and the message of a validation failure holds the
# rejected value: turning on the framework's request logs to look at something must not write what clients sent to the log.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.springframework.web.method.HandlerMethod=INFO

# Spring Boot's filter for forms reads the whole of a PUT, PATCH or DELETE form body to offer it as parameters, and it runs
# ahead of the security chain: anyone on the network could make the server hold as much as they care to send. No operation
# of the API takes a form.
spring.mvc.formcontent.filter.enabled=false

# No operation of the API takes a file either, and the resolver parses a multipart body before anything looks at its
# format: a broken one would fail as an error of this side instead of being refused as a format like any other.
spring.servlet.multipart.enabled=false
