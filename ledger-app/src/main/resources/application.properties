spring.application.name=ledger-app

# Having a web server on the classpath must not turn every process into one: this process checks its settings, its
# role and its schema and exits, and only the api profile opens a port.
spring.main.web-application-type=none

# Currencies this deployment operates (decision 15); override with LEDGER_CURRENCIES.
ledger.currencies=COP

# Modulith Moments publishes time-passing events from a scheduler thread that keeps the process
# alive; nothing listens to those events yet.
spring.modulith.moments.enabled=false

# Migrating belongs to its own process and role, the migrate profile; a process serving requests never changes the schema.
spring.flyway.enabled=false

# A deployment whose mapping does not match its migrated schema does not start.
spring.jpa.hibernate.ddl-auto=validate

# Spring would otherwise open a persistence session before the controller, while no tenant is in scope yet, and keep it
# until the end of the request: a lazy read outside a transaction would then see no rows instead of failing.
spring.jpa.open-in-view=false

# A request spends most of its time waiting on the database, and a virtual thread waits without holding a platform
# thread: what limits concurrency is then the connection pool, not a pool of threads sized by hand.
spring.threads.virtual.enabled=true

# A field the contract does not declare is refused rather than ignored: a client that sets one believes it has an effect.
spring.jackson.deserialization.fail-on-unknown-properties=true
