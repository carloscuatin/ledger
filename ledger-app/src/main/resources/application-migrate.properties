# The process that migrates the schema before a deployment, with a role of its own. It uses the
# application's DataSource, so missing connection settings stop it instead of letting Flyway switch
# itself off and the process report success without migrating anything.
spring.flyway.enabled=true

# Hibernate would validate the schema against the mapping in the very process that brings it up to date.
# Spring Data goes with it: its repositories need the EntityManagerFactory that Hibernate would build.
spring.autoconfigure.exclude=\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
